{% extends "website/base.html" %}

{% block content %}
<section class="container mx-auto px-4 py-8">
    <div class="bg-white shadow-lg rounded-lg p-8">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Sign Up!!!</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <h3 class="text-xl font-bold mb-2">Account Information</h3>
            {{ user_form.as_p }}
            <h3 class="text-xl font-bold mb-2">Profile Information</h3>
            {{ profile_form.as_p }}
            <button type="submit" class="w-full py-3 mt-6 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition duration-300">Register</button>
        </form>
    </div>
</section>
{% endblock content %}
