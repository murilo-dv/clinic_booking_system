{% load static tailwind_tags %}
{% tailwind_css %}
<h2 class="text-2xl font-bold mb-4 text-red-200">Patient Sign Up!!!</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <h3 class="text-xl font-bold mb-2">Account Information</h3>
    {{ user_form.as_p }}
    <h3 class="text-xl font-bold mb-2">Profile Information</h3>
    {{ profile_form.as_p }}
    <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded">Register</button>
</form>
