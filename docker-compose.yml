version: "3.7"

x-app: &default-app
  build:
    image: murilodv/booking-system:latest
  volumes:
    - .:/app
  restart: "unless-stopped"
  working_dir: /app

services:
  web:
    <<: *default-app
    command: "python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    networks:
      - webnet

  tailwind:
    <<: *default-app
    command: "python manage.py tailwind start"
    # Without tty, no stdin, and tailwind watcher aborts
    # https://github.com/tailwindlabs/tailwindcss/issues/5324
    tty: true
    networks:
      - webnet

networks:
  webnet:
    external: true