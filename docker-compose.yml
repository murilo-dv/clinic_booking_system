version: "3.7"

x-app: &default-app
  build:
    image: murilodv/booking-system:latest
  volumes:
    - .:/app
  restart: "unless-stopped"
  working_dir: /app

services:
  web:
    <<: *default-app
    command: "python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    networks:
      - webnet

  tailwind:
    <<: *default-app
    command: >
      bash -c "
        cd theme/static_src &&
        rm -rf node_modules package-lock.json &&
        npm install &&
        cd ../.. &&
        python manage.py tailwind start
      "
    tty: true
    networks:
      - webnet

networks:
  webnet:
    external: true